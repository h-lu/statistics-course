lesson_id: v2-l04-r2
title: 第04课 · 设计服务质量评价办法
duration_seconds:
  attempt_a: 300
  learn: 240
  attempt_b: 300
items:
- concept_id: center-tail
  title: 集中趋势与较长等待
  tutor_context: 用中位数相同而高分位数不同的数据，解释一项中心位置统计量为什么不能概括全部分布。
  pair:
    a:
      prompt: 两个窗口的等待中位数都为8分钟，第90百分位数分别为15和40分钟。哪项解释合适？
      options:
      - id: A
        text: 两个第90百分位数不同，说明中位数至少一个算错
        misconception: different-summaries-as-error
      - id: B
        text: 中位数相同，说明两窗口等待分布相同
        misconception: same-median-same-distribution
      - id: C
        text: 中位数相同，但较高分位数显示的等待不同
        misconception: null
      - id: D
        text: 第90百分位数就是各窗口最大等待
        misconception: quantile-as-maximum
      answer: C
      explanation: 中位数描述中间位置，第90百分位数描述较高位置，二者可以同时成立。不能把高分位数当最大值，也不能由中位数相同推出整个分布相同。
    b:
      prompt: 某月中位数比上月下降，但等待超过30分钟的工单从5张增到20张。只发布中位数下降，可能遗漏什么？
      options:
      - id: A
        text: 长等待数量增加已证明超时比例一定增加
        misconception: count-as-rate-without-denominator
      - id: B
        text: 将超过30分钟的记录删去，才能评价典型体验
        misconception: tail-exclusion-required
      - id: C
        text: 中位数下降已说明全部工单都等待更短
        misconception: median-as-universal-improvement
      - id: D
        text: 较长等待的数量增加，需结合总工单数解释
        misconception: null
      answer: D
      explanation: 中位数可能不反映尾部变化。20比5多，但比例还需要各月工单总数；应同时呈现相关指标，而不是推断所有人改善，或删除真实长等待。
- concept_id: iqr-robustness
  title: 四分位距与稳健性的局限
  tutor_context: 用中间取值相同、两端不同的小数据解释四分位距；讨论指标稳定不等于总负担没有变化。
  pair:
    a:
      prompt: 数据为1、5、5、5、100。采用线性插值，第一和第三四分位数都为5，四分位距为0。它说明什么？
      options:
      - id: A
        text: 全部记录都等于5
        misconception: zero-iqr-equal-data
      - id: B
        text: 100违反四分位距，必须是录入错误
        misconception: iqr-proves-invalid
      - id: C
        text: 最大值与最小值之差为0
        misconception: iqr-as-range
      - id: D
        text: 两个四分位数相等，但两端仍可有不同取值
        misconception: null
      answer: D
      explanation: 四分位距只由第一和第三四分位数确定，本例为5−5＝0。它不是全距，不能排除1和100，也不能证明其中一个值无效。
    b:
      prompt: 一组真实等待的最大值由40增到80分钟，其余记录不变，中位数与四分位距均不变。关心总等待负担时应怎样报告？
      options:
      - id: A
        text: 只报告中位数不变，因极端等待不属评价内容
        misconception: tail-ignored-by-default
      - id: B
        text: 把80改回40，保持不同时期可比
        misconception: change-observation-for-comparability
      - id: C
        text: 保留中部指标，并报告总等待增加40分钟
        misconception: null
      - id: D
        text: 中部指标不变，所以总等待负担没有变化
        misconception: robust-summary-hides-total
      answer: C
      explanation: 稳健指标可以对个别极端变化不敏感，但总和确实增加40分钟。是否关注这一变化取决于目标；不能用中部不变否认总量变化，更不能为可比性改写真实值。
- concept_id: composite
  title: 综合指标的单位与计数
  tutor_context: 用不同单位的指标和两个重叠事件举例，解释尺度转换、权重以及同一记录只计一次。
  pair:
    a:
      prompt: 要将平均等待分钟与满意比例合成一个总分，哪项处理不可省略？
      options:
      - id: A
        text: 说明尺度转换、好坏方向、权重和可以怎样相互补偿
        misconception: null
      - id: B
        text: 分钟先换成秒，再与百分比相加
        misconception: unit-change-as-commensurability
      - id: C
        text: 两个数先各保留两位小数，再直接相加
        misconception: rounding-as-scaling
      - id: D
        text: 让数值较大的指标自然占更大影响
        misconception: magnitude-as-value-weight
      answer: A
      explanation: 相同小数位或都写成数字，不表示单位可直接相加。合成总分需要说明目标取舍；分钟换秒反而会改变未经处理的数值权重。也可以分别报告指标，不强行合成。
    b:
      prompt: 10张工单中，3张放弃、4张等待超过业务参考时间，其中2张两项都符合。以全部工单为分母，“放弃或超时”的比例是多少？
      options:
      - id: A
        text: 5÷7，约71.43%
        misconception: served-denominator-for-all-event
      - id: B
        text: 5÷10＝50%
        misconception: null
      - id: C
        text: 2÷10＝20%
        misconception: intersection-instead-of-union
      - id: D
        text: 7÷10＝70%
        misconception: double-count-overlap
      answer: B
      explanation: 符合至少一项的有3＋4−2＝5张，同一工单不能计两次，分母仍为全部10张。2张是同时符合两项，不是“或”；改用未放弃的7张又更换了对象。
- concept_id: goal-metric
  title: 指标与评价目标
  tutor_context: 用总等待、单张超时阈值和一组超时比例说明不同目标对应不同计算，并练习是否包含等号。
  pair:
    a:
      prompt: 甲窗口100张工单，平均等待5分钟；乙50张，平均8分钟。全部记录均有效。若关心总等待分钟，哪项正确？
      options:
      - id: A
        text: 乙均值较大，所以乙总等待为800分钟
        misconception: wrong-group-size
      - id: B
        text: 甲为500分钟，乙为400分钟，甲的总量较大
        misconception: null
      - id: C
        text: 甲均值较小，所以总等待也较小
        misconception: mean-as-total
      - id: D
        text: 甲乙合计平均为6.5分钟，因此总量相同
        misconception: unweighted-average-as-total
      answer: B
      explanation: 总量等于记录数乘均值：100×5＝500，50×8＝400。均值较小并不保证总量较小；两组数量不同时也不能用均值的简单平均代替整体计算。
    b:
      prompt: 规则规定：等待“超过15分钟”算超时，超时比例“大于10%”才需调查。10张工单中2张恰为15分钟，1张为16分钟，其余不足15分钟。怎样判断？
      options:
      - id: A
        text: 超时比例为30%，触发调查条件
        misconception: include-time-equality
      - id: B
        text: 超时比例为10%，触发调查条件
        misconception: include-rate-equality
      - id: C
        text: 超时比例为1%，没有触发调查条件
        misconception: percent-conversion
      - id: D
        text: 超时比例为10%，没有触发调查条件
        misconception: null
      answer: D
      explanation: 只有16分钟那张超过15分钟，1÷10＝10%。10%并不大于10%，因此未触发。15分钟用于单张判断，10%用于整组判断；两个严格不等号都要保留。
- concept_id: incentive
  title: 评价办法与行为激励
  tutor_context: 用机构只接容易业务的情境，区分指标改善、实际改善与需要检查的选择行为。
  pair:
    a:
      prompt: 机构只按已受理工单的办结比例排名，不报告拒接与业务难度。哪项风险最值得检查？
      options:
      - id: A
        text: 可能通过少接困难业务提高表面办结比例
        misconception: null
      - id: B
        text: 只要分母是已受理工单，业务构成不会影响排名
        misconception: denominator-hides-mix
      - id: C
        text: 排名变化本身足以证明每类业务均已改善
        misconception: rank-as-all-group-improvement
      - id: D
        text: 办结比例越高，就能排除业务选择问题
        misconception: high-rate-rules-out-selection
      answer: A
      explanation: 受理哪些业务会改变进入分母的对象，可能产生少接困难业务的激励。这是需防范和核实的风险，不是仅凭规则就证明某机构已经这样做。
    b:
      prompt: 维修站报告“已接单业务的按时完成比例上升”，但同期困难业务接单数下降。哪项补充信息最有助于判断是否只是选择了容易业务？
      options:
      - id: A
        text: 把未接的困难业务排除后再次计算同一比例
        misconception: repeat-selected-denominator
      - id: B
        text: 列出各类申请、接单和拒单数量，再比较同类业务结果
        misconception: null
      - id: C
        text: 只增加完成比例的小数位
        misconception: precision-not-coverage
      - id: D
        text: 只列总体完成数量，不区分申请与拒单
        misconception: totals-hide-selection
      answer: B
      explanation: 需要观察进入服务的范围是否改变，并在同类业务内比较。更精确地显示原比例或重复排除未接业务，不能回答选择问题；总量也不能单独区分业务构成变化。

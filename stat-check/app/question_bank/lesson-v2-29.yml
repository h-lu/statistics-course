lesson_id: v2-l29
title: "第29课 · 政策前后变化能否归因于政策"
duration_seconds:
  attempt_a: 300
  learn: 240
  attempt_b: 300
items:
  - concept_id: c1
    title: "双重差分"
    tutor_context: "请解释“双重差分”，换一个不同于原题的情境举例并反问一道短题，等待学习者回答后反馈。关注概念含义、适用条件与常见混淆，不代答原题。"
    pair:
      a:
        prompt: "处理组下降6，对照组下降2，双重差分是多少？"
        options:
          - id: A
            text: "−6"
            misconception: "c1-a-confusion-1"
          - id: B
            text: "−4"
            misconception: null
          - id: C
            text: "−8"
            misconception: "c1-a-confusion-3"
          - id: D
            text: "4"
            misconception: "c1-a-confusion-4"
        answer: B
        explanation: "处理变化−6减对照变化−2得到−4。"
      b:
        prompt: "某政策组从60升到70，对照从40升到48，单看上涨10漏掉什么？"
        options:
          - id: A
            text: "政策必然造成10"
            misconception: "c1-b-confusion-1"
          - id: B
            text: "差分必须等于两组后期差22"
            misconception: "c1-b-confusion-2"
          - id: C
            text: "同期共同变化，DiD为2"
            misconception: null
          - id: D
            text: "需要先把所有值除以100"
            misconception: "c1-b-confusion-4"
        answer: C
        explanation: "对照变化8提供共同时间变化参照，10−8=2。"
  - concept_id: c2
    title: "平行趋势"
    tutor_context: "请解释“平行趋势”，换一个不同于原题的情境举例并反问一道短题，等待学习者回答后反馈。关注概念含义、适用条件与常见混淆，不代答原题。"
    pair:
      a:
        prompt: "双重差分的平行趋势假设针对什么？"
        options:
          - id: A
            text: "两组结果水平始终相同"
            misconception: "c2-a-confusion-1"
          - id: B
            text: "政策后两组必须继续完全平行"
            misconception: "c2-a-confusion-2"
          - id: C
            text: "没有政策时两组所需可比的反事实趋势"
            misconception: null
          - id: D
            text: "两组人口数量必须相等"
            misconception: "c2-a-confusion-4"
        answer: C
        explanation: "水平可不同，关键是无处理情况下趋势的可比性。"
      b:
        prompt: "前趋势检验未显著，能推出什么？"
        options:
          - id: A
            text: "已经严格证明无政策趋势平行"
            misconception: "c2-b-confusion-1"
          - id: B
            text: "不需要再讨论同期冲击"
            misconception: "c2-b-confusion-2"
          - id: C
            text: "政策效果必定无偏"
            misconception: "c2-b-confusion-3"
          - id: D
            text: "资料未明显反对所检验差异，但不能证明假设成立"
            misconception: null
        answer: D
        explanation: "未拒绝可能来自低功效或有限窗口，不是反事实假设证明。"
  - concept_id: c3
    title: "事件时间"
    tutor_context: "请解释“事件时间”，换一个不同于原题的情境举例并反问一道短题，等待学习者回答后反馈。关注概念含义、适用条件与常见混淆，不代答原题。"
    pair:
      a:
        prompt: "政策在月18开始，月15的事件时间是多少？"
        options:
          - id: A
            text: "15"
            misconception: "c3-a-confusion-1"
          - id: B
            text: "3"
            misconception: "c3-a-confusion-2"
          - id: C
            text: "18"
            misconception: "c3-a-confusion-3"
          - id: D
            text: "−3"
            misconception: null
        answer: D
        explanation: "事件时间=当前月减政策开始月，因此为−3。"
      b:
        prompt: "把不同政策时点的地区按“距实施几个月”对齐，主要帮助什么？"
        options:
          - id: A
            text: "比较政策相对时点的动态变化"
            misconception: null
          - id: B
            text: "自动消除处理异质性问题"
            misconception: "c3-b-confusion-2"
          - id: C
            text: "自动随机化地区"
            misconception: "c3-b-confusion-3"
          - id: D
            text: "保证所有估计权重合理"
            misconception: "c3-b-confusion-4"
        answer: A
        explanation: "事件时间方便看动态，但不自动解决识别或异质性问题。"
  - concept_id: c4
    title: "聚类推断"
    tutor_context: "请解释“聚类推断”，换一个不同于原题的情境举例并反问一道短题，等待学习者回答后反馈。关注概念含义、适用条件与常见混淆，不代答原题。"
    pair:
      a:
        prompt: "24个地区各36月，区间估计为何不能机械把864行当独立？"
        options:
          - id: A
            text: "同一地区月度结果可能相关"
            misconception: null
          - id: B
            text: "每个地区只能有一行数据"
            misconception: "c4-a-confusion-2"
          - id: C
            text: "月度结果不能是数值"
            misconception: "c4-a-confusion-3"
          - id: D
            text: "大于30行就没有标准误"
            misconception: "c4-a-confusion-4"
        answer: A
        explanation: "聚类单位与重复观测结构决定独立信息。"
      b:
        prompt: "按地区自助抽样时通常应怎样抽？"
        options:
          - id: A
            text: "每次独立打散所有月份"
            misconception: "c4-b-confusion-1"
          - id: B
            text: "每次抽地区并带上其完整时间序列"
            misconception: null
          - id: C
            text: "只抽政策后结果较好的地区"
            misconception: "c4-b-confusion-3"
          - id: D
            text: "只复制人口最多的地区"
            misconception: "c4-b-confusion-4"
        answer: B
        explanation: "整群重抽保留地区内时间相关，少聚类仍需谨慎。"
  - concept_id: c5
    title: "安慰剂与干扰"
    tutor_context: "请解释“安慰剂与干扰”，换一个不同于原题的情境举例并反问一道短题，等待学习者回答后反馈。关注概念含义、适用条件与常见混淆，不代答原题。"
    pair:
      a:
        prompt: "附近对照也受政策传播，主要威胁是什么？"
        options:
          - id: A
            text: "所有数据必定没有季节性"
            misconception: "c5-a-confusion-1"
          - id: B
            text: "对照不再代表完全未受政策影响的反事实"
            misconception: null
          - id: C
            text: "处理组均值不能计算"
            misconception: "c5-a-confusion-3"
          - id: D
            text: "政策开始月必须改成0"
            misconception: "c5-a-confusion-4"
        answer: B
        explanation: "干扰可能污染对照，改变DiD解释。"
      b:
        prompt: "把政策时点提前到事前做安慰剂，若也出现明显变化，合理用途是什么？"
        options:
          - id: A
            text: "直接证明真实政策毫无作用"
            misconception: "c5-b-confusion-1"
          - id: B
            text: "自动寻找最显著的时点发布"
            misconception: "c5-b-confusion-2"
          - id: C
            text: "排查趋势、同期差异或设计不适配"
            misconception: null
          - id: D
            text: "将安慰剂结果从报告中删去"
            misconception: "c5-b-confusion-4"
        answer: C
        explanation: "安慰剂用于检验替代解释，不能机械取代实质识别讨论。"


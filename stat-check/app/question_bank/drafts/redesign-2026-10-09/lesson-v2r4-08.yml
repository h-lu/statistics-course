            {
              "id": "D",
              "text": "保留排班12人时，直接把业务量记0，因为左连接空值表示无业务",
              "misconception": "left-join-null-as-confirmed-zero"
            }
          ],
          "answer": "A",
          "explanation": "A：排班12人时已知；没有业务匹配可能是零业务或记录缺失，需核实来源。 B：没有活动匹配不能否定已有排班，删除会改变计划范围。 C：已知排班量不能改成0，未知业务量也不能直接填0。 D：左连接空值只表示未匹配，不能证明业务日志完整或真实零业务。"
        },
        "b": {
          "prompt": "某仓库日的排班计划为8人时，出库记录没有匹配行，尚不清楚当日记录是否漏导出。报告该日排班量与出库件数时，哪项合适？",
          "options": [

  "items": [
    {
      "concept_id": "latest-revision-conflict",
      "title": "最新修订中的内容冲突",
      "tutor_context": "另设两行同属最新修订但测量值不同的例子，说明版本较新与内容已核实的区别，以及哪些信息仍可保留。不要复述原题或给出原题答案。",
      "pair": {
        "a": {
          "prompt": "工单K的旧修订号3记录等待6分钟；已确认最新修订号12有两行，分别记录5分钟和9分钟，其他字段一致。要依据最新已核实数据报告等待，哪项处理合适？",
          "options": [
            {
              "id": "A",
              "text": "取文件最后一行的9分钟，作为已核实值",
              "misconception": "file-order-resolves-content-conflict"
            },
            {
              "id": "B",
              "text": "取两行均值7分钟，作为已核实值",
              "misconception": "average-conflicting-records-as-truth"
            },
            {
              "id": "C",
              "text": "保留工单及冲突标记，将等待值列为待核实",
              "misconception": null
            },
            {
              "id": "D",
              "text": "取旧修订的6分钟，仍称为最新已核实值",
              "misconception": "fallback-old-version-as-latest"
            }
          ],
          "answer": "C",
          "explanation": "A：文件顺序不能核实同一最新版本中的哪个值正确。 B：5与9的均值7是另作的计算，不能作为已核实测量。 C：两行都是最新却互相冲突，应保留追溯信息，相关等待暂不能作为已核实值。 D：旧修订可供追溯，但不能改称最新；临时使用需另说明规则和条件。"
        },
        "b": {
          "prompt": "某商品库存的旧修订号4记录24件；已确认最新修订号9有两行，分别记录18件和22件，其他字段一致。要依据最新已核实数据报告库存，哪项处理合适？",
          "options": [
            {
              "id": "A",
              "text": "保留库存记录及冲突标记，将件数列为待核实",
              "misconception": null
            },
            {
              "id": "B",
              "text": "取两行均值20件，作为已核实值",
              "misconception": "average-conflicting-records-as-truth"
            },
            {
              "id": "C",
              "text": "取旧修订的24件，仍称为最新已核实值",
              "misconception": "fallback-old-version-as-latest"
            },
            {
              "id": "D",
              "text": "取文件最后一行的22件，作为已核实值",
              "misconception": "file-order-resolves-content-conflict"
            }
          ],
          "answer": "A",
          "explanation": "A：同一最新修订号的件数冲突，仍需核查来源；记录及其他一致信息可以保留。 B：18与22的均值20不代表已查明真实库存。 C：旧修订不是最新，不能用旧值冒充最新已核实值。 D：题目没有依据证明最后一行正确，行序不能消解内容冲突。"
        }
      }
    },
    {
      "concept_id": "aggregate-before-unit-join",
      "title": "先汇总事件，保留主表单位",
      "tutor_context": "另设一个主表对象对应多次事件、另一个没有事件且日志完整的例子，解释怎样保留每个主表对象一行并记录真实事件次数。不要复述原题或给出原题答案。",
      "pair": {
        "a": {
          "prompt": "三张工单甲、乙、丙分别有1、3、0次接触，接触日志已确认完整。要补充接触次数并保持三张工单各一行，哪项合适？",
          "options": [
            {
              "id": "A",
              "text": "直接内连接接触表，仍称三张工单各一行",
              "misconception": "inner-join-drops-zero-event-unit"
            },
            {
              "id": "B",
              "text": "先按工单汇总接触次数，再保留三张工单连接，次数为1、3、0",
              "misconception": null
            },
            {
              "id": "C",
              "text": "每工单只留首次接触，再把三张工单的次数都记1",
              "misconception": "drop-real-repeat-events"
            },
            {
              "id": "D",
              "text": "把4条接触记录追加到工单表下，称为7张工单",
              "misconception": "append-events-as-new-units"
            }
          ],
          "answer": "B",
          "explanation": "A：丙没有接触行会消失，乙会展开成三行，不能保持每工单一行。 B：先汇总再连接可保留三张工单和真实次数；日志完整，丙确无接触可记0。 C：乙的后两次真实接触被丢掉，丙也不应记1。 D：接触和工单是不同记录单位，追加不能把接触变成新工单。"
        },
        "b": {
          "prompt": "三张订单甲、乙、丙分别有2、0、1次配送，配送日志已确认完整。要补充配送次数并保持三张订单各一行，哪项合适？",
          "options": [
            {
              "id": "A",
              "text": "把3条配送记录追加到订单表下，称为6张订单",
              "misconception": "append-events-as-new-units"
            },
            {
              "id": "B",
              "text": "直接内连接配送表，仍称三张订单各一行",
              "misconception": "inner-join-drops-zero-event-unit"
            },
            {
              "id": "C",
              "text": "每订单只留首次配送，再把三张订单的次数都记1",
              "misconception": "drop-real-repeat-events"
            },
            {
              "id": "D",
              "text": "先按订单汇总配送次数，再保留三张订单连接，次数为2、0、1",
              "misconception": null
            }
          ],
          "answer": "D",
          "explanation": "A：配送记录不是新的订单，混合记录单位会误计订单数。 B：乙没有配送行会消失，甲会展开成两行。 C：甲的第二次真实配送被丢掉，乙也不应记1。 D：汇总保留事件次数，保留订单避免漏掉乙；日志完整，乙确无配送可记0。"
        }
      }
    },
    {
      "concept_id": "unit-mean-after-duplication",
      "title": "重复行与单位等权均值",
      "tutor_context": "另设两个对象的固定测量值在事件行重复的例子，分别计算对象等权均值和展开行均值，说明为何只改分母仍可能错误。不要用各次新增费用代替复制的固定属性，不复述原题或给出原题答案。",
      "pair": {
        "a": {
          "prompt": "两张报修单等待6分钟和18分钟，分别有2次和4次现场记录；每次现场记录都复制所属报修单的等待。展开行均值为14分钟。若目标是两张报修单等权的平均等待，哪项正确？",
          "options": [
            {
              "id": "A",
              "text": "14分钟，直接使用展开行均值",
              "misconception": "expanded-rows-as-equal-units"
            },
            {
              "id": "B",
              "text": "42分钟，把展开等待总和84除以两张报修单",
              "misconception": "repair-denominator-not-duplicated-sum"
            },
            {
              "id": "C",
              "text": "6分钟，只保留等待较短的报修单",
              "misconception": "drop-unit-to-avoid-duplicates"
            },
            {
              "id": "D",
              "text": "12分钟，两张报修单的等待各计一次",
              "misconception": null
            }
          ],
          "answer": "D",
          "explanation": "A：两张报修单按2次和4次重复，14是现场记录加权结果。 B：展开分子84已重复，仅把分母改为2仍错。 C：删除一张真实报修单改变了目标对象。 D：每张报修单等权，均值为(6+18)/2=12分钟。"
        },
        "b": {
          "prompt": "两张订单总金额分别为80元和200元，分别有3条和1条状态事件；每条事件都原样复制所属订单的总金额。展开行均值为110元。若目标是两张订单等权的平均总金额，哪项正确？",
          "options": [
            {
              "id": "A",
              "text": "110元，直接使用展开行均值",
              "misconception": "expanded-rows-as-equal-units"
            },
            {
              "id": "B",
              "text": "140元，两张订单的总金额各计一次",
              "misconception": null
            },
            {
              "id": "C",
              "text": "220元，把展开金额总和440除以两张订单",
              "misconception": "repair-denominator-not-duplicated-sum"
            },
            {
              "id": "D",
              "text": "80元，只保留总金额较小的订单",
              "misconception": "drop-unit-to-avoid-duplicates"
            }
          ],
          "answer": "B",
          "explanation": "A：80元被计三次，200元被计一次，110是事件行均值。 B：每张订单等权，均值为(80+200)/2=140元。 C：展开分子440已重复，改分母为2仍不能恢复订单均值。 D：只留一张订单改变了目标范围。这里各事件行复制固定订单总金额，不是各次新增费用。"
        }
      }
    },
    {
      "concept_id": "unmatched-activity-zero-or-unknown",
      "title": "未匹配活动记录：零还是未知",
      "tutor_context": "另设计划记录存在但活动日志未匹配的例子，说明计划量与活动量分别已知什么，以及确认数据完整后才可判断零活动的条件。不要复述原题或给出原题答案。",
      "pair": {

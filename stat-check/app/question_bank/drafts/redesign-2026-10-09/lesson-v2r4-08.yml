            {
              "id": "C",
              "text": "保留排班8人时，出库件数暂记未知，核实记录后才能确认是否为0",
              "misconception": null
            },
            {
              "id": "D",
              "text": "保留排班8人时，直接把出库件数记0，因为左连接空值表示未出库",
              "misconception": "left-join-null-as-confirmed-zero"
            }
          ],
          "answer": "C",
          "explanation": "A：出库记录未匹配不能使已知排班消失，删除会改变计划范围。 B：排班8人时已知；尚未取得完整出库信息也不等于0件。 C：分别保留已知计划量与未知活动量，查明日志是否完整及真实业务后再判断零值。 D：左连接空值不证明没有出库，也可能是漏导出或未匹配。"
        }
      }
    },
    {
      "concept_id": "person-time-plan-ratio",
      "title": "统一人时单位后计算工作量与排班量之比",
      "tutor_context": "另设人员排班和工作人员分钟的例子，按同一顺序比较：扣除合计缺勤得到计划人时，分钟除以60换成人时，再计算记录工作量除以计划量。解释比值的含义和限制，不复述原题或给出原题答案。",
      "pair": {
        "a": {
          "prompt": "某窗口3人各计划5小时，当日合计缺勤3人时。接触记录工作人员分钟总计420。要计算“记录的接触耗时（人时）÷扣除缺勤后的排班人时”，哪项正确？",
          "options": [
            {
              "id": "A",
              "text": "420/(3×5−3)=35",
              "misconception": "minutes-over-hours-without-conversion"
            },
            {
              "id": "B",
              "text": "(420/60)/[3×(5−3)]=7/6",
              "misconception": "multiply-total-absence-per-person"
            },
            {
              "id": "C",
              "text": "(3×5−3)/(420/60)=12/7",
              "misconception": "reverse-ratio"
            },
            {
              "id": "D",
              "text": "(420/60)/(3×5−3)=7/12",
              "misconception": null
            }
          ],
          "answer": "D",
          "explanation": "A：工作人员分钟与排班人时没有统一单位，35不是题问比值。 B：3人时是合计缺勤，只减一次，不能按每人各缺勤3小时计算。 C：这是排班量除接触量，方向与题目相反。 D：420分钟为7人时，排班为15−3=12人时，比值7/12；计划量不等于实际劳动投入，不能由此断定个人生产率。"
        },
        "b": {
          "prompt": "某电话服务组2人各计划7小时，当日合计缺勤1人时。接听与处理咨询记录工作人员分钟总计600。要计算“记录的咨询处理耗时（人时）÷扣除缺勤后的排班人时”，哪项正确？",
          "options": [
            {
              "id": "A",
              "text": "600/(2×7−1)=600/13",
              "misconception": "minutes-over-hours-without-conversion"
            },
            {
              "id": "B",
              "text": "(600/60)/(2×7−1)=10/13",
              "misconception": null
            },
            {
              "id": "C",
              "text": "(600/60)/[2×(7−1)]=10/12",
              "misconception": "multiply-total-absence-per-person"
            },
            {
              "id": "D",
              "text": "(2×7−1)/(600/60)=13/10",
              "misconception": "reverse-ratio"
            }
          ],
          "answer": "B",
          "explanation": "A：分子还是分钟，分母是人时，未统一单位。 B：600分钟为10人时，排班为14−1=13人时，比值10/13。 C：合计缺勤1人时只减一次，不能对每人都减1小时。 D：这是排班量除咨询量，方向相反。该比值描述记录工作量与计划量的关系，不是个人生产率。"
        }
      }
    }
  ]

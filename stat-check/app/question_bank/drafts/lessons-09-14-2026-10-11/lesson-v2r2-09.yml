          "answer": "A",
          "explanation": "A正确。即使敏感度和特异度不变，原本故障比例升高，也能让阳性中真正故障的比例升高。因此不能只看这个比例，就认定检测性能提高；也不能把每个阳性都当作已确认故障。"
        }
      }

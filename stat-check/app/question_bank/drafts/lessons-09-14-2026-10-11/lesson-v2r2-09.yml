      "tutor_context": "请用不同于题目的小例解释“自然频数”，说明对象、条件和常见混淆，再提出一道迁移问题；AI可参与全过程。",
      "pair": {
        "a": {
          "prompt": "1000台设备中有10台故障。检测敏感度为90%、特异度为95%，据此预计有9台真阳性、49.5台假阳性。阳性设备中实际故障的比例（阳性预测值）约是多少？",
          "options": [
            {
              "id": "A",
              "text": "90%",
              "misconception": "90%"
            },
            {
              "id": "B",
              "text": "95%",

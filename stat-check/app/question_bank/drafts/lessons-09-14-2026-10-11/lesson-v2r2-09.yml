    {
      "concept_id": "l09-r2-c1",
      "title": "条件方向",
      "tutor_context": "请用不同于题目的小例解释“条件方向”，说明对象、条件和常见混淆，再提出一道迁移问题；AI可参与全过程。",
      "pair": {
        "a": {
          "prompt": "同一批设备中，共有25台实际故障。筛查结果有100台阳性，其中20台实际故障。“阳性设备中实际故障的比例”应怎样计算？",
          "options": [
            {
              "id": "A",
              "text": "20/25",
              "misconception": "20/25"
            },
            {
              "id": "B",
              "text": "20/100",
              "misconception": null
            },
            {
              "id": "C",
              "text": "100/125",
              "misconception": "100/125"
            },
            {
              "id": "D",
              "text": "25/100",
              "misconception": "25/100"
            }
          ],
          "answer": "B",
          "explanation": "B正确。题目已经限定在100台阳性设备中看，其中20台实际故障，所以是20÷100。20÷25则是在全部25台故障设备中，看有多少被筛查为阳性，回答的是敏感度。"
        },
        "b": {
          "prompt": "报表说：“实际故障的设备中，有80%会报警。”某台设备现在报警了，能否直接说“这台设备有80%的概率故障”？",
          "options": [
            {
              "id": "A",
              "text": "能，条件概率可倒过来",
              "misconception": "能，条件概率可倒过来"
            },
            {
              "id": "B",
              "text": "能，只要样本量超过30",
              "misconception": "能，只要样本量超过30"
            },
            {
              "id": "C",
              "text": "不能，因为概率不能用于设备",
              "misconception": "不能，因为概率不能用于设备"
            },
            {
              "id": "D",
              "text": "不能。还需要知道所有设备中的故障比例，以及未故障设备有多大比例也会报警。",
              "misconception": null
            }
          ],
          "answer": "D",
          "explanation": "D正确。“故障设备中有多少报警”与“报警设备中有多少故障”，分母不同。报警既可能来自真故障，也可能是误报。需要结合原本的故障比例和误报情况，才能解释一次报警。"
        }
      }
    },
    {

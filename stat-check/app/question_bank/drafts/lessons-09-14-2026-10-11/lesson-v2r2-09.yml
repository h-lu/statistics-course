          "answer": "D",
          "explanation": "D正确。阳性总量预计为9＋49.5＝58.5台，其中9台真的故障，比例为9÷58.5≈15.38%。49.5是按比例得到的预计台数，可以带小数，并非说一次实际检查能出现半台设备。90%是敏感度，95%是特异度，1%是原本的故障比例。"
        },
        "b": {
          "prompt": "另一批设备有100台故障、900台未故障。检测敏感度为90%、特异度为95%。在预计筛查为阳性的设备中，真故障与未故障分别有多少台？",
          "options": [
            {
              "id": "A",
              "text": "真故障90台，未故障855台。",
              "misconception": "故障90，非故障855"
            },
            {
              "id": "B",
              "text": "真故障90台，未故障45台。",
              "misconception": null
            },
            {
              "id": "C",
              "text": "真故障10台，未故障45台。",
              "misconception": "故障10，非故障45"
            },
            {
              "id": "D",
              "text": "真故障90台，未故障5台。",
              "misconception": "故障90，非故障5"
            }

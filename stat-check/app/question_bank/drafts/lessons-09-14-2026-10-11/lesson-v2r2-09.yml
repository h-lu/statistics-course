          "answer": "B",
          "explanation": "B正确。100台故障设备中，预计100×90%＝90台阳性；900台未故障设备中，预计900×(1−95%)＝45台误报为阳性。855台是正确报为阴性的未故障设备，不应放入阳性这一组。"
        }
      }

      "pair": {
        "a": {
          "prompt": "甲、乙两地用相同方法筛查设备，敏感度都是90%，特异度都是95%。甲地所有设备中的故障比例比乙地低。按这些比例计算，阳性设备中实际故障的比例哪边更低？",

services:
  stat-check:
    build: .
    container_name: statistics-stat-check
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8895:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/stat-check/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

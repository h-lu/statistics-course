      "concept_id": "l10-r3-20261013-c1",
      "title": "期望与实际需求",
      "tutor_context": "请用不同于题目的例子解释本概念，并让学生核对分母、条件和计算；AI可参与。",
      "pair": {
        "a": {
          "prompt": "某请求数取1或3，概率分别为0.75和0.25。长期平均请求数是多少？",
          "options": [
            {
              "id": "A",
              "text": "1.5",
              "misconception": null
            },
            {
              "id": "B",
              "text": "2",
              "misconception": "2"
            },
            {
              "id": "C",
              "text": "3",
              "misconception": "3"
            },
            {
              "id": "D",
              "text": "0.5",
              "misconception": "0.5"
            }
          ],
          "answer": "A",
          "explanation": "按概率加权为1×0.75+3×0.25=1.5，不能将两个数等权平均。"
        },
        "b": {
          "prompt": "一天需求的期望是2.4台。哪种解释合适？",
          "options": [
            {
              "id": "A",
              "text": "每天一定收到2.4台",
              "misconception": "每天一定收到2.4台"
            },
            {
              "id": "B",
              "text": "约有24%的天收到10台",
              "misconception": "约有24%的天收到10台"
            },
            {
              "id": "C",
              "text": "长期平均约2.4台，每天实际数量可以不同",
              "misconception": null
            },
            {
              "id": "D",
              "text": "最多收到3台",
              "misconception": "最多收到3台"
            }
          ],
          "answer": "C",
          "explanation": "期望是长期平均，不规定每一天的数量，也不能据此推断上限。"
        }
      }
    },

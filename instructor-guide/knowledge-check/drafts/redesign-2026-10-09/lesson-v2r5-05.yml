    {
      "concept_id": "conditional-error-denominators",
      "title": "错误率的条件分母",
      "tutor_context": "用一个新的复核情境说明假阳性率、假阴性率与名单中故障比例的不同分母，再解释零分母为何未定义。",
      "pair": {
        "a": {
          "prompt": "60条设备日记录的结果均已知，其中12条故障。规则选中15条复核，包含9条故障。选中为规则阳性，故障为实际阳性。假阳性率与假阴性率分别是多少？",
          "options": [
            {
              "id": "A",
              "text": "6/15与3/45",
              "misconception": "action-denominator-for-error-rates"
            },
            {
              "id": "B",
              "text": "6/48与3/12",
              "misconception": null
            },
            {
              "id": "C",
              "text": "6/60与3/60",
              "misconception": "all-records-for-both-errors"
            },
            {
              "id": "D",
              "text": "9/12与6/48",
              "misconception": "detection-rate-as-miss-rate"
            }
          ],
          "answer": "B",
          "explanation": "A：6/15是入选者中未故障比例；3/45是未入选者中故障比例，都不是所问条件分母。 B：假阳性为15−9=6，实际未故障为60−12=48；假阴性为12−9=3，实际故障为12。 C：以全部60条为分母得到两类错误占全记录的比例，不能替代各自条件错误率。 D：9/12是检出的故障比例，即真阳性率；第二个量是假阳性率，次序和概念都不符合题问。"
        },
        "b": {
          "prompt": "一批18条设备日记录全部未故障，规则选中4条复核。选中为规则阳性，故障为实际阳性。哪项报告正确？",
          "options": [
            {
              "id": "A",
              "text": "假阴性率0%，假阳性率4/18",
              "misconception": "zero-over-zero-as-zero"
            },
            {
              "id": "B",
              "text": "假阴性率14/18，假阳性率4/18",
              "misconception": "not-selected-as-missed-faults"
            },
            {
              "id": "C",
              "text": "两种错误率都不能计算",
              "misconception": "one-empty-group-invalidates-all-rates"
            },
            {
              "id": "D",
              "text": "假阴性率不能计算，假阳性率4/18",
              "misconception": null
            }
          ],
          "answer": "D",
          "explanation": "A：实际故障为0条，假阴性率的0/0未定义，不能记为0%；第二项分母虽正确，整项仍不正确。 B：14条未入选者全未故障，不是漏掉的故障；漏报的分母也不是全部记录。 C：实际未故障有18条，假阳性率可以计算；只有假阴性率缺少分母。 D：故障总数为0，所以假阴性率未定义；未故障18条中4条被选中，假阳性率为4/18。"
        }
      }
    },
    {
      "concept_id": "daily-capacity",
      "title": "逐日容量与允许少用名额",
      "tutor_context": "用两个不同容量的日期解释每日上限；再区分上限与必须用满的任务量。",
      "pair": {
        "a": {
          "prompt": "周一最多复核3台，周二最多1台。某方案两天分别选2台和2台，解释说两天总数4台等于总名额4台，因此合规。应怎样判断？",
          "options": [
            {
              "id": "A",
              "text": "合规，两天总数没有超过总名额",
              "misconception": "pooled-capacity-replaces-daily-limit"
            },
            {
              "id": "B",
              "text": "不合规，原因只是周一必须用满3台",
              "misconception": "capacity-as-minimum"
            },
            {
              "id": "C",
              "text": "不合规，周二超额；周一空余名额不能转给周二",
              "misconception": null
            },
            {
              "id": "D",
              "text": "合规，把周一空余1台记到周二即可",
              "misconception": "carry-unused-capacity-forward"
            }
          ],
          "answer": "C",
          "explanation": "A：逐日约束不能只用两天总量代替；周二已超过1台。 B：题目给的是最多3台，不是必须复核3台；周一选2台本身合规。 C：周二选2台超过当天1台；总量相等和周一少用都不能取消逐日上限。 D：题设没有允许跨日借用，事后记账不能让实际周二行动符合当天上限。"
        },
        "b": {
          "prompt": "当天容量上限为6台。给定效果和成本假设下，4台的复核期望净收益为正，另2台为负；没有其他必须复核要求。若目标是减少期望总损失，怎样理解上限？",
          "options": [
            {
              "id": "A",
              "text": "可只选择4台，不必为了用满名额再加入负收益设备",
              "misconception": null
            },
            {
              "id": "B",
              "text": "必须选6台，否则规则不合格",
              "misconception": "quota-must-be-filled"
            },
            {
              "id": "C",
              "text": "应一台也不选，因为少复核必然损失更小",
              "misconception": "review-cost-only-objective"
            },
            {
              "id": "D",
              "text": "把剩余2个名额加到明天，所以明天可超上限2台",
              "misconception": "unused-quota-as-future-permission"
            }
          ],
          "answer": "A",
          "explanation": "A：容量是行动上限；在题设损失目标下加入负净收益设备会增加期望损失。 B：最多6台不等于至少6台；用满名额不能凌驾于题设损失目标。 C：4台正净收益已经考虑成本与避免损失，不选会放弃题设中可减少的损失。 D：未使用名额不改变明天的上限，题目没有跨日转移规则。"
        }
      }
    },
    {
      "concept_id": "scenario-total-loss",
      "title": "情境损失与效果假设",
      "tutor_context": "另举成本、损失和复核避免比例的例子，说明所有入选者都付成本，避免比例不改写历史故障标签。",
      "pair": {
        "a": {
          "prompt": "3台设备中1台事后故障，规则复核2台且包括该故障。每次复核成本3，故障损失180；假设复核可避免75%的损失。未故障且未复核者损失为0。情境总损失为多少成本单位？",
          "options": [
            {
              "id": "A",
              "text": "141",
              "misconception": "avoided-fraction-used-as-residual"
            },
            {
              "id": "B",
              "text": "51",
              "misconception": null
            },
            {
              "id": "C",
              "text": "45",
              "misconception": "omit-all-review-costs"
            },
            {
              "id": "D",
              "text": "6",
              "misconception": "assume-perfect-prevention"
            }
          ],
          "answer": "B",
          "explanation": "A：180×75%+6=141把避免比例当成剩余比例；剩余应为25%。 B：两次成本共6，故障剩余损失180×25%=45，总损失51。 C：45只计剩余故障损失，遗漏故障与未故障两次复核都要付的成本6。 D：6只计复核成本，75%避免不是100%避免，还留下45的故障损失。"
        },
        "b": {
          "prompt": "同一批记录中，甲漏掉1次损失96的故障，复核成本与已复核故障剩余损失合计24；乙漏掉2次故障，每次损失16，其余上述成本合计48。所有数值均为同一成本单位。怎样比较？",
          "options": [
            {
              "id": "A",
              "text": "甲更好，因为只漏1次，乙漏2次",
              "misconception": "miss-count-replaces-loss"
            },
            {
              "id": "B",
              "text": "甲96、乙32就是各自总损失",
              "misconception": "omit-cost-and-residual-component"
            },
            {
              "id": "C",
              "text": "乙总损失80，低于甲的120",
              "misconception": null
            },
            {
              "id": "D",
              "text": "两方案都只报告24与48，因为未复核不产生成本",
              "misconception": "unselected-losses-ignored"
            }
          ],
          "answer": "C",
          "explanation": "A：错误次数忽略每次后果；甲总损失96+24=120，大于乙32+48=80。 B：96和32仅是未复核故障损失，遗漏已给出的24和48。 C：甲96+24=120，乙2×16+48=80；少漏一次不保证总损失小。 D：未复核虽不付复核成本，仍承担漏掉故障的损失，不能忽略96与32。"
        }
      }
    },
    {

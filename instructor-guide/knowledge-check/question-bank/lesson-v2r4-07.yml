            {
              "id": "B",
              "text": "目前只知道回答率与业务类别有关；同一类别内，回答意愿是否还与满意程度有关，尚不能确定。",
              "misconception": null
            },
            {
              "id": "C",
              "text": "已证明非随机缺失，因为回答率不一样",

              "id": "D",
              "text": "已证明随机缺失，因为类别已记录",
              "misconception": "measuring-covariate-proves-mar"
            }
          ],
          "answer": "B",
          "explanation": "B正确。例如，某类业务回答率低，可能与联系方式有关，也可能与满意程度有关，仅凭各类回答率不能区分。随机缺失（MAR）允许回答概率与已记录的业务类别有关，但还要求在同一类别内，未知评分不再影响回答概率；记录了类别，并不能自动证明这一要求成立。"
        },
        "b": {
          "prompt": "分析者假设：同一业务类别里，回答者可以代表未回答者。但某个目标类别一份评价也没有。只靠这个假设，能否算出该类满意比例，再与其他类别加权合并？",
          "options": [
            {
              "id": "A",
              "text": "能，随机缺失假设自动给出该类别数值",
              "misconception": "mar-creates-unobserved-stratum-outcomes"
            },
            {
              "id": "B",
              "text": "能，把零回答类别的满意比例设为0",
              "misconception": "zero-responses-as-zero-satisfaction"
            },
            {
              "id": "C",
              "text": "不能直接算。还需取得该类评价；如果借用其他类别推算，也要另说明理由和假设。",
              "misconception": null
            },
            {
              "id": "D",
              "text": "能，若该类别较小，就从目标构成删掉而不作说明",
              "misconception": "drop-small-unsupported-target-group"
            }
          ],
          "answer": "C",
          "explanation": "C正确。“回答者能代表未答者”并没有提供具体数值。这个类别没有回答者，满意人数和回答人数都无从计算；不能把它记成0%满意，也不能悄悄从目标中删除。需要补问，或明确说明借用其他类别信息进行估计的额外假设。"
        }
      }
    }
  ]

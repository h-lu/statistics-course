<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450"><title>同一组分层比例：构成不同，总体结果就不同</title><rect width="960" height="450" fill="#f8fafc"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d;font-size:20px}.title{font-size:26px;font-weight:700}.small{font-size:17px}.box{stroke:#cbd5e1;stroke-width:2;rx:12}</style><text x="40" y="45" class="title">同一组分层比例：构成不同，总体结果就不同</text><text x="40" y="90" class="">实际业务构成</text><text x="520" y="90" class="">共同构成：两类各占一半</text><rect class="box" x="40" y="115" width="400" height="85" fill="#dbeafe"/><text x="55" y="148" class="">A：常规20%，复杂80%</text><text x="55" y="182" class="">20%×90% + 80%×60% = 66%</text><rect class="box" x="40" y="215" width="400" height="85" fill="#fef3c7"/><text x="55" y="248" class="">B：常规80%，复杂20%</text><text x="55" y="282" class="">80%×80% + 20%×50% = 74%</text><text x="459" y="205" class="">→</text><rect class="box" x="520" y="115" width="400" height="85" fill="#dbeafe"/><text x="535" y="148" class="">A：常规50%，复杂50%</text><text x="535" y="182" class="">50%×90% + 50%×60% = 75%</text><rect class="box" x="520" y="215" width="400" height="85" fill="#fef3c7"/><text x="535" y="248" class="">B：常规50%，复杂50%</text><text x="535" y="282" class="">50%×80% + 50%×50% = 65%</text><text x="40" y="353" class="">A每类业务的办结比例都更高，但实际承接了更多复杂业务。</text><text x="40" y="397" class="small">共同构成是比较用的参考；没有改变实际工单与实际办结数。</text></svg>

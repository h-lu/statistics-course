<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450"><title>同一工单表，两种连接方案</title><rect width="960" height="450" fill="#f8fafc"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d;font-size:20px}.title{font-size:26px;font-weight:700}.small{font-size:17px}.box{stroke:#cbd5e1;stroke-width:2;rx:12}</style><text x="40" y="45" class="title">同一工单表，两种连接方案</text><rect class="box" x="35" y="95" width="230" height="195" fill="#dbeafe"/><text x="55" y="132" class="">原工单表：2行</text><text x="55" y="175" class="">T1　等待2分钟</text><text x="55" y="210" class="">T2　等待10分钟</text><text x="55" y="262" class="small">工单均值：6分钟</text><text x="280" y="192" class="">→</text><rect class="box" x="325" y="95" width="275" height="195" fill="#fee2e2"/><text x="345" y="132" class="">直接连接：4行</text><text x="345" y="167" class="">T1　2　接触C1</text><text x="345" y="199" class="">T1　2　接触C2</text><text x="345" y="231" class="">T1　2　接触C3</text><text x="345" y="263" class="">T2　10　接触C4</text><text x="615" y="192" class="">或</text><rect class="box" x="660" y="95" width="265" height="195" fill="#dcfce7"/><text x="680" y="132" class="">接触先汇总后连接</text><text x="680" y="175" class="">T1　2分钟　3次接触</text><text x="680" y="210" class="">T2　10分钟　1次接触</text><text x="680" y="262" class="small">工单均值仍是6分钟</text><text x="35" y="340" class="">中间表按行平均：(2+2+2+10)÷4=4分钟，T1被算了三次。</text><text x="35" y="384" class="small">右侧方案从原始接触表按工单汇总，再连接原工单表。</text></svg>
